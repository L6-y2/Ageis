<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a"/>
      <stop offset="50%" stop-color="#0e172e"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Energy Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 12"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#shieldGrad)" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Glowing Aegis Shield -->
  <path d="M 256,90 L 370,140 C 370,270 290,360 256,410 C 222,360 142,270 142,140 Z"
        fill="url(#shieldGrad)"
        fill-opacity="0.25"
        stroke="url(#shieldGrad)"
        stroke-width="8"
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Inner Cyber Core Shield -->
  <path d="M 256,125 L 340,165 C 340,260 280,330 256,370 C 232,330 172,260 172,165 Z"
        fill="#0b1120"
        stroke="url(#cyanGrad)"
        stroke-width="5"
        stroke-linejoin="round"/>

  <!-- Geometric Emblem Crest: Crown / Star / Wings -->
  <!-- Top Central Diamond -->
  <polygon points="256,155 272,180 256,205 240,180" fill="url(#goldGrad)" filter="url(#neonGlow)"/>
  
  <!-- Central AI Eye / Neural Core -->
  <circle cx="256" cy="255" r="28" fill="none" stroke="url(#cyanGrad)" stroke-width="4"/>
  <circle cx="256" cy="255" r="14" fill="url(#goldGrad)"/>

  <!-- Energy Circuit Traces -->
  <path d="M 256,285 L 256,335" stroke="url(#cyanGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 226,255 L 195,255 L 185,225" fill="none" stroke="url(#shieldGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 286,255 L 317,255 L 327,225" fill="none" stroke="url(#shieldGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Glowing Highlights -->
  <line x1="220" y1="300" x2="256" y2="340" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="292" y1="300" x2="256" y2="340" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round"/>
</svg>
